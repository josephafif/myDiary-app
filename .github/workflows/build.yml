name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      # Viktigt: Capacitor behöver webDir (t.ex. "www") med index.html i repo.
      - name: Check webDir exists
        run: |
          if ! grep -q '"webDir"' capacitor.config.json 2>/dev/null; then
            echo "capacitor.config.json saknar webDir eller finns inte."
            ls -la
            exit 1
          fi
          WEBDIR=$(node -e "console.log(require('./capacitor.config.json').webDir || '')")
          if [ -z "$WEBDIR" ]; then
            echo "webDir är tom i capacitor.config.json"
            exit 1
          fi
          if [ ! -d "$WEBDIR" ]; then
            echo "WebDir '$WEBDIR' saknas i repo. Lägg till din webapp (index.html) i den mappen."
            ls -la
            exit 1
          fi

      - name: Add Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ exists — skipping cap add"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure gradlew is executable
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
